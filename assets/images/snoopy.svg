    <g class="part tail" style="transform-origin:262px 322px">
      <path d="M260 330 Q292 318 300 290 Q304 280 296 278 Q286 300 258 310 Z" fill="#FFFEFB"/>
    </g>
    <!-- тело -->
    <path d="M150 380 C 122 326, 134 238, 196 222 C 258 238, 272 326, 246 380 Z" fill="#FFFEFB"/>
    <ellipse cx="166" cy="380" rx="34" ry="14" fill="#FFFEFB"/>
    <ellipse cx="236" cy="380" rx="34" ry="14" fill="#FFFEFB"/>
    <path d="M154 300 Q140 326 160 340 M240 300 Q258 322 244 340" fill="none" stroke-width="6"/>
    <!-- ошейник -->
    <path d="M156 246 Q198 264 240 246" fill="none" stroke="#E46F6A" stroke-width="12"/>
    <!-- голова в профиль: круглая макушка и длинная мордочка вправо -->
    <g class="part head" style="transform-origin:196px 250px">
      <path d="M118 150 C 118 92, 176 66, 222 84 C 258 98, 300 112, 330 132 C 356 150, 352 196, 318 206 C 280 216, 240 214, 214 232 C 176 258, 120 220, 118 150 Z" fill="#FFFEFB"/>
