      <ellipse cx="328" cy="133" rx="7" ry="4" fill="#fff" stroke="none" opacity=".7"/>
      <path d="M262 186 Q292 196 318 186" fill="none" stroke-width="5"/>
      <circle cx="262" cy="170" r="13" fill="#F4B6B0" stroke="none" opacity=".6"/>
      <g class="eyes" style="transform-origin:226px 128px" stroke="none">
        <ellipse cx="226" cy="128" rx="8" ry="14" fill="#2F2B2C"/>
        <circle cx="228" cy="122" r="3" fill="#fff"/>
      </g>
      <!-- длинное чёрное ухо -->
      <g class="part ear" style="transform-origin:160px 106px">
        <path d="M150 96 C 120 112, 108 168, 120 214 C 128 238, 158 236, 164 212 C 172 176, 176 130, 168 104 Z" fill="#3E3A3B"/>
