<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="animal-svg">
  <g class="whole" style="transform-origin:200px 385px" stroke="#3E3A3B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
